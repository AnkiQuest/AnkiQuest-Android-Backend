version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
# The commit SHAs third-party actions are pinned to. AnkiQuest's own
# workflows and actions stay at master; a release gets a week before it is
# proposed, so a bad or compromised one has time to be pulled.
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  ignore:
    - dependency-name: "AnkiQuest/*"
  groups:
    github-actions:
      patterns:
        - "*"
  commit-message:
    prefix: ci
- package-ecosystem: cargo
  directories:
    - "/"
    - "/build_rust"
    - "/rslib-bridge"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  allow:
    - dependency-type: "direct"
  ignore:
    # Ignore anki dependencies, those are managed upstream
    - dependency-name: "anki*"
  groups:
    non-breaking:
      update-types:
        - "minor"
        - "patch"
  open-pull-requests-limit: 10
